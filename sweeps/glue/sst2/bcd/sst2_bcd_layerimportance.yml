name: roberta_base_bcd_later_importance[0.5d]_adamw_sst2_target[all]
project: bcd_bench_sst2
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=roberta-base
  - --task_name=sst2
  - --bcd_target_attn=True
  - --bcd_target_mlp=True
  - --bcd_update_order=grad_distribution
  - --bcd_activated_layers=3
  - --grad_importance_exp=0.5
  - --optimizer=bcd-optimizer
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=16
  - --gradient_accumulation_steps=1
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=10
  - --output_dir=experiments/glue_finetuning/results/Adam/sst2/
  - --fp16=True
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=cosine
method: grid
parameters:
  learning_rate:
    values:
      - 3e-5
      - 2e-5
      - "1.5e-5"
      - 1e-5
      - 8e-6
  weight_decay:
    values:
      - 0

program: experiments/glue_finetuning/run_glue.py
name: roberta_base_bcd_adamw_rte_target[attn]_interval[10]_order[shuffle]
project: bcd_bench_rte
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=roberta-base
  - --task_name=rte
  - --bcd_target_attn=True
  - --bcd_target_mlp=False
  - --bcd_interval_steps=10
  - --bcd_activated_layers=3
  - --optimizer=bcd-optimizer
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=16
  - --gradient_accumulation_steps=1
  - --bcd_update_order=shuffling
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=40
  - --output_dir=experiments/glue_finetuning/results/Adam/rte/
  - --fp16=True
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=cosine
method: grid
parameters:
  learning_rate:
    values:
      - 1e-5
      - 2e-5
      - 3e-5
      - 4e-5
      - 5e-5
      - 6e-5
  weight_decay:
    values:
      - 0

program: experiments/glue_finetuning/run_glue.py
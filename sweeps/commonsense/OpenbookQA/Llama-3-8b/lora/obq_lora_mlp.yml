name: llama-3-8b_lora_adamw_obq_target[mlp]
project: bcd_bench_obq
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=meta-llama/Meta-Llama-3-8B
  - --task_name=obq
  - --dataset_path=datasets/openbookqa
  - --task_name=openbookqa
  - --lora=True
  - --lora_r=8
  - --lora_alpha=16
  - --lora_target=up_proj,down_proj
  - --optimizer=adamw
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=8
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=1
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=8
  - --output_dir=experiments/glue_finetuning/results/Adam/obq/
  - --fp16=True
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
method: grid
parameters:
  learning_rate:
    values:
      - 3e-4
      - 1e-4
      - 5e-4
  weight_decay:
    values:
      - 0

program: experiments/commonsense/finetune.py
name: llama-3-8b_bcd_bandit_exp_gran[module][0.03/1/5]_commonsense_target[all]
project: bcd_bench_commonsense
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=meta-llama/Meta-Llama-3-8B
  - --task_name=commonsense
  - --bcd_target_attn=True
  - --bcd_target_mlp=True
  - --bcd_update_order=bandit_exp
  - --dataset_path=datasets/commonsense170k
  - --task_name=commonsense
  - --optimizer=bcd-optimizer
  - --granularity=module
  - --LRU=2
  - --grad_importance_exp=0
  - --offload_optimizer_state=False
  - --bcd_interval_steps=50
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=4
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --max_grad_norm=10
  - --save_strategy=no
  - --num_train_epochs=3
  - --output_dir=experiments/glue_finetuning/results/Adam/commonsense/
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=linear
method: grid
parameters:
  learning_rate:
    values:
      - 5e-6
  param_ratio_limit:
    values:
      - 0.03
      - 0.01
      - 0.05
  weight_decay:
    values:
      - 0

program: experiments/commonsense/finetune_evaluate_all.py
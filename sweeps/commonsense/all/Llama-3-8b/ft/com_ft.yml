name: llama-3-8b_FT_adamw_commonsense
project: bcd_bench_commonsense
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=meta-llama/Meta-Llama-3-8B
  - --task_name=commonsense
  - --optimizer=adamw
  - --dataset_path=datasets/commonsense170k
  - --task_name=commonsense
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=4
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=3
  - --output_dir=experiments/glue_finetuning/results/Adam/commonsense/
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
method: grid
parameters:
  learning_rate:
    values:
      - 2e-6
  weight_decay:
    values:
      - 0

program: experiments/commonsense/finetune_evaluate_all.py
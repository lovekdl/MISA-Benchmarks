name: qwen-2.5-7b_lora_adamw_commonsense_r[16]_target[q,k,v,up,down]
project: bcd_bench_commonsense
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=Qwen/Qwen2.5-7B-Instruct
  - --task_name=commonsense
  - --lora=True
  - --lora_r=16
  - --lora_alpha=32
  - --lora_target=q_proj,k_proj,v_proj,up_proj,down_proj
  - --optimizer=adamw
  - --dataset_path=datasets/commonsense170k
  - --task_name=commonsense
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=4
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=3
  - --output_dir=experiments/glue_finetuning/results/Adam/commonsense/
  - --fp16=True
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
method: grid
parameters:
  learning_rate:
    values:
      - 1e-4
  weight_decay:
    values:
      - 0

program: experiments/commonsense/finetune_evaluate_all.py
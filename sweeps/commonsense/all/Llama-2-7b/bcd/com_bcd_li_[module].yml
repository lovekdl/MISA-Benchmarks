name: llama-2-7b_bcd_importance[0]_gran[module][0.03]_clip[10]_commonsense_target[all]
project: bcd_bench_commonsense
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=meta-llama/Llama-2-7b-hf
  - --task_name=commonsense
  - --bcd_target_attn=True
  - --bcd_target_mlp=True
  - --bcd_update_order=grad_distribution
  - --dataset_path=datasets/commonsense170k
  - --task_name=commonsense
  - --optimizer=bcd-optimizer
  - --granularity=module
  - --LRU=1
  - --param_ratio_limit=0.03
  - --max_grad_norm=10
  - --bcd_activated_layers=7
  - --grad_importance_exp=0
  - --offload_optimizer_state=False
  - --bcd_interval_steps=50
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=4
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=3
  - --output_dir=experiments/glue_finetuning/results/Adam/commonsense/
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=linear
method: grid
parameters:
  learning_rate:
    values:
      - 1e-5
      - 5e-6
  weight_decay:
    values:
      - 0

program: experiments/commonsense/finetune_evaluate_all.py
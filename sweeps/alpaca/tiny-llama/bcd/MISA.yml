name: llama-3-8b_bcd_bandit_alpaca_gran[module][0.045]
project: bcd_bench_alpaca
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --dataset_path=vicgalle/alpaca-gpt4
  - --model_name_or_path=TinyLlama/TinyLlama-1.1B-Chat-v1.0
  - --task_name=alpaca
  - --bcd_target_attn=True
  - --bcd_target_mlp=True
  - --bcd_update_order=bandit_sq
  - --bandit_eta=0.5
  - --optimizer=bcd-optimizer
  - --granularity=module
  - --LRU=2
  - --grad_importance_exp=0
  - --offload_optimizer_state=False
  - --bcd_interval_steps=50
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=4
  - --max_seq_length=512
  - --eval_strategy=steps
  - --eval_steps=100
  - --eval_on_start=True
  - --max_grad_norm=10
  - --save_strategy=no
  - --num_train_epochs=3
  - --param_ratio_limit=0.0454545
  - --output_dir=experiments/glue_finetuning/results/Adam/commonsense/
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --load_type=bf16
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=linear
method: grid
parameters:
  learning_rate:
    values:
      - 5e-6
      - 1e-5
      - 5e-5
      - 1e-6
  weight_decay:
    values:
      - 0

program: experiments/alpaca/finetune.py
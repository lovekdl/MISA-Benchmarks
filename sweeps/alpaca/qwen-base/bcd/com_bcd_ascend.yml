name: QBase_BAdam_adamw_alpaca_target[all]
project: bcd_bench_alpaca
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --dataset_path=vicgalle/alpaca-gpt4
  - --model_name_or_path=Qwen/Qwen2.5-7B
  - --task_name=alpaca
  - --bcd_target_attn=True
  - --bcd_target_mlp=True
  - --optimizer=bcd-optimizer
  - --bcd_update_order=ascending
  - --bcd_activated_layers=1
  - --bcd_interval_steps=50
  - --grad_importance_exp=0
  - --task_name=modulealpaca
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=4
  - --max_seq_length=512
  - --eval_strategy=steps
  - --eval_steps=100
  - --eval_on_start=True
  - --save_strategy=no
  - --num_train_epochs=3
  - --eval_strategy=steps
  - --output_dir=saves/
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=cosine
  - --warmup_steps=50
method: grid
parameters:
  learning_rate:
    values:
      - 5e-6
  weight_decay:
    values:
      - 0

program: experiments/alpaca/finetune.py
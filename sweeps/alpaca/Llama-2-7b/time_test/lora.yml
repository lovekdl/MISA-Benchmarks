name: test_lora_time
project: bcd_test_time
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --dataset_path=vicgalle/alpaca-gpt4
  - --model_name_or_path=meta-llama/Llama-2-7b-hf
  - --task_name=alpaca
  - --lora=True
  - --lora_r=32
  - --lora_alpha=64
  - --save_model_at_last=False
  - --lora_target=q_proj,v_proj,up_proj,down_proj
  - --optimizer=adamw
  - --seed=42
  - --report_to=wandb
  - --per_device_train_batch_size=1
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=1
  - --eval_strategy=no
  - --max_seq_length=512
  - --save_strategy=no
  - --num_train_epochs=3
  - --output_dir=experiments/glue_finetuning/results/Adam/alpaca/
  - --fp16=True
  - --do_eval=False
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
method: grid
parameters:
  learning_rate:
    values:
      - 1e-4
  weight_decay:
    values:
      - 0

program: experiments/alpaca/finetune.py
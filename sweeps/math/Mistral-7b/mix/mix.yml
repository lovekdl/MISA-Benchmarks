name: Mistral7B_MIX_bcd_bandit_exp_grand[module][0.03]_LRU[2]_clipnorm[10]_math_target[all]
project: bcd_bench_math
command:
  - ${interpreter}
  - ${program}
  - ${args}
  - --model_name_or_path=mistralai/Mistral-7B-v0.3
  - --task_name=math
  - --lora_r=16
  - --lora=True
  - --lora_alpha=32
  - --lora_target=q_proj,k_proj,v_proj,up_proj,down_proj
  - --bcd_target_attn=True
  - --bcd_target_mlp=True
  - --bcd_update_order=bandit_exp
  - --dataset_path=datasets/Math10k
  - --task_name=math
  - --optimizer=bcd-optimizer
  - --grad_importance_exp=0
  - --LRU=2
  - --granularity=module
  - --max_grad_norm=10
  - --offload_optimizer_state=False
  - --bcd_interval_steps=50
  - --seed=114514
  - --report_to=wandb
  - --per_device_train_batch_size=4
  - --per_device_eval_batch_size=1 
  - --gradient_accumulation_steps=1
  - --max_seq_length=512
  - --eval_strategy=epoch
  - --save_strategy=no
  - --num_train_epochs=6
  - --output_dir=experiments/glue_finetuning/results/Adam/math/
  - --do_eval=True
  - --do_train=True 
  - --do_predict=False
  - --logging_steps=1
  - --save_total_limit=0
  - --report_to=wandb
  - --pad_to_max_length=False
  - --overwrite_output_dir=True
  - --lr_scheduler_type=linear
method: grid
parameters:
  learning_rate:
    values:
      - 2e-4
  param_ratio_limit:
    values:
      - 0.3
      - 0.1
      - 0.5
  weight_decay:
    values:
      - 0

program: experiments/math/finetune.py